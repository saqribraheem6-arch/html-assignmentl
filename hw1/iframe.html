<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة مجالات تقنية المعلومات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            line-height: 1.8;
            font-size: 18px;
            color: #222;
        }
        h2 {
            color: #0066cc;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 8px;
        }
        ul {
            margin-top: 15px;
        }
        li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h2>أهم مجالات تقنية المعلومات:</h2>
    <ul>
        <li><strong>تطوير الويب (Web Development):</strong> بناء وتصميم المواقع والتطبيقات.</li>
        <li><strong>الأمن السيبراني (Cybersecurity):</strong> حماية الأنظمة والبيانات من الاختراقات.</li>
        <li><strong>إدارة الشبكات (Networking):</strong> ربط الأجهزة والأنظمة ببعضها.</li>
        <li><strong>قواعد البيانات (Databases):</strong> تنظيم وحفظ البيانات الكبيرة.</li>
    </ul>

</body>
</html>
